<!doctype html>
<html lang="en">
<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root{color-scheme:light;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
    html,body{margin:0}
    body{font:14px system-ui,sans-serif}
    img{max-width:100%}
    [hidden]{display:none!important}
  </style>
<title>SmartHire AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: fixed left sidebar rail + scrolling main workspace; collapses to a top bar with a drawer at phone width */
:root{
  --bg:#f4f5f8;
  --surface:#ffffff;
  --surface-2:#eef0f5;
  --ink:#1b1e28;
  --ink-soft:#5a6072;
  --ink-faint:#8a90a2;
  --line:#e2e5ee;
  --accent:#4a46e0;
  --accent-soft:#ecebfb;
  --ok:#2f8f5b;
  --ok-soft:#e3f3ea;
  --warn:#b4791a;
  --warn-soft:#f7edda;
  --crit:#c23b3b;
  --crit-soft:#f8e4e4;
  /* pipeline stage hues */
  --st-new:#6b7280;
  --st-review:#4a46e0;
  --st-interview:#b4791a;
  --st-offer:#2f8f5b;
  --st-hired:#116149;
  --shadow:0 1px 2px rgba(20,22,40,.06), 0 8px 24px rgba(20,22,40,.05);
  --radius:14px;
  --font-display:"Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --font-body:"IBM Plex Sans", system-ui, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1117;
    --surface:#171a22;
    --surface-2:#1f232e;
    --ink:#eceef4;
    --ink-soft:#a8aec0;
    --ink-faint:#747b8e;
    --line:#2a2f3c;
    --accent:#8c88ff;
    --accent-soft:#232145;
    --ok:#5fc78b;
    --ok-soft:#163326;
    --warn:#dcab5a;
    --warn-soft:#352a16;
    --crit:#e97c7c;
    --crit-soft:#361e1e;
    --st-new:#9aa1b2;
    --st-review:#8c88ff;
    --st-interview:#dcab5a;
    --st-offer:#5fc78b;
    --st-hired:#49b98c;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1117;
  --surface:#171a22;
  --surface-2:#1f232e;
  --ink:#eceef4;
  --ink-soft:#a8aec0;
  --ink-faint:#747b8e;
  --line:#2a2f3c;
  --accent:#8c88ff;
  --accent-soft:#232145;
  --ok:#5fc78b;
  --ok-soft:#163326;
  --warn:#dcab5a;
  --warn-soft:#352a16;
  --crit:#e97c7c;
  --crit-soft:#361e1e;
  --st-new:#9aa1b2;
  --st-review:#8c88ff;
  --st-interview:#dcab5a;
  --st-offer:#5fc78b;
  --st-hired:#49b98c;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
button{font-family:inherit}
a{color:var(--accent)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100%}
.sidebar{
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:4px;
  padding:22px 14px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand .logo{
  width:34px;height:34px;border-radius:9px;flex:none;
  background:linear-gradient(135deg,var(--accent),#8c88ff);
  display:grid;place-items:center;color:#fff;font-family:var(--font-display);font-weight:700;font-size:17px;
}
.brand .name{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand .tag{font-size:10.5px;color:var(--ink-faint);letter-spacing:.09em;text-transform:uppercase}
.nav-group{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);padding:12px 12px 6px}
.nav-btn{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:none;border:0;cursor:pointer;color:var(--ink-soft);
  padding:9px 12px;border-radius:10px;font-size:14px;font-weight:500;
}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-btn svg{width:18px;height:18px;flex:none}
.nav-btn .count{margin-left:auto;font-size:12px;color:var(--ink-faint);font-family:var(--font-mono)}
.nav-btn.active .count{color:var(--accent)}
.sidebar .spacer{flex:1}

.topbar{display:none}

.main{min-width:0;display:flex;flex-direction:column}
.content{padding:30px clamp(16px,4vw,40px) 60px;max-width:1180px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.page-head h1{font-size:clamp(23px,3.5vw,30px);letter-spacing:-.02em}
.page-head .sub{color:var(--ink-soft);font-size:14px;margin-top:5px;max-width:60ch}

/* ---------- controls ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;cursor:pointer;
  padding:9px 15px;border-radius:10px;font-size:13.5px;font-weight:600;background:var(--surface-2);color:var(--ink);
}
.btn:hover{filter:brightness(.98)}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--accent);color:#fff}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink-soft)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn-danger{background:transparent;border-color:var(--line);color:var(--crit)}
.btn-danger:hover{background:var(--crit-soft)}

input,select,textarea{
  width:100%;font-family:inherit;font-size:14px;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
}
textarea{resize:vertical;min-height:72px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
label{font-size:12.5px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:6px}
.field{margin-bottom:14px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hint{font-size:11.5px;color:var(--ink-faint);margin-top:5px}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:18px 20px}
.grid{display:grid;gap:18px}

/* stat tiles */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.stat .k{font-size:12px;color:var(--ink-soft);font-weight:600;display:flex;align-items:center;gap:7px}
.stat .v{font-family:var(--font-mono);font-size:34px;font-weight:600;letter-spacing:-.02em;margin-top:6px}
.stat .dot{width:8px;height:8px;border-radius:50%}

/* ---------- lists ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .search{position:relative;flex:1;min-width:180px}
.toolbar .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-faint)}
.toolbar .search input{padding-left:34px}
.toolbar select{width:auto;min-width:140px}

.item{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:15px 17px;box-shadow:var(--shadow)}
.item + .item{margin-top:12px}
.item-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.item-title{font-family:var(--font-display);font-weight:600;font-size:16px}
.item-meta{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.item-desc{font-size:13px;color:var(--ink-soft);margin-top:9px}
.item-actions{display:flex;gap:7px;flex:none}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line)}
.chip.match{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.miss{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}

/* stage badge */
.stage{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2)}
.stage .d{width:7px;height:7px;border-radius:50%}
.st-select{width:auto;min-width:118px;padding:6px 10px;font-size:12.5px;font-weight:600}

.empty{text-align:center;padding:46px 20px;color:var(--ink-faint)}
.empty svg{width:34px;height:34px;margin-bottom:10px;opacity:.5}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,17,23,.5);backdrop-filter:blur(2px);display:grid;place-items:start center;padding:28px 16px;overflow-y:auto;z-index:60}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:560px;margin-top:20px}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:18px}
.modal-body{padding:20px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 20px;border-top:1px solid var(--line)}
.icon-btn{background:none;border:0;cursor:pointer;color:var(--ink-faint);padding:4px;border-radius:7px;display:grid;place-items:center}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}

/* ---------- pipeline board ---------- */
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-items:start}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:100px}
.col-head{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:3px 5px 10px;text-transform:uppercase;letter-spacing:.05em}
.col-head .n{margin-left:auto;font-family:var(--font-mono);color:var(--ink-faint)}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 11px;box-shadow:var(--shadow)}
.pcard + .pcard{margin-top:9px}
.pcard .pn{font-weight:600;font-size:13.5px}
.pcard .pm{font-size:11.5px;color:var(--ink-soft);margin-top:2px}
.pcard select{margin-top:9px;padding:5px 8px;font-size:12px}

/* ---------- matching ---------- */
.match-head{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
.score-ring{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-mono);font-size:28px;font-weight:600}
.formula{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--ink-soft);margin-top:14px}
.formula code{font-family:var(--font-mono);color:var(--ink);font-size:12px}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.qlist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.qlist li{display:flex;gap:10px;font-size:13.5px;color:var(--ink);padding:11px 13px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.qlist li .num{font-family:var(--font-mono);color:var(--accent);font-weight:600;flex:none}
.section-label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin:4px 0 11px}

.banner{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--ink-soft);background:var(--warn-soft);border:1px solid transparent;border-radius:10px;padding:11px 14px;margin-bottom:20px}
.banner svg{width:16px;height:16px;flex:none;color:var(--warn);margin-top:1px}

@media (max-width:900px){
  .board{grid-template-columns:repeat(2,1fr)}
  .two-col,.match-head,.field-row{grid-template-columns:1fr}
}
@media (max-width:720px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:70;transform:translateX(-100%);transition:transform .22s ease;height:100%;padding-top:max(22px,env(safe-area-inset-top,0px))}
  .sidebar.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(15,17,23,.45);z-index:65}
  .topbar{
    display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
    background:var(--surface);border-bottom:1px solid var(--line);
    padding:12px max(16px,env(safe-area-inset-left,0px));
  }
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:41}
  .topbar .name{font-family:var(--font-display);font-weight:700;font-size:16px}
  .content{padding:20px max(16px,env(safe-area-inset-left,0px)) 50px}
  .board{grid-template-columns:1fr}
}
html,body{height:auto}
</style>
</head>
<body>


<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">S</div>
      <div>
        <div class="name">SmartHire AI</div>
        <div class="tag">Recruitment</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="spacer"></div>
    <button class="nav-btn" id="themeToggle" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span>Theme</span>
    </button>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="icon-btn" id="menuBtn" type="button" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <span class="name">SmartHire AI</span>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>

<div id="modalRoot"></div>

<script>
"use strict";

/* ---------------- storage ---------------- */
var KEY_J="smarthire_jobs_v1", KEY_C="smarthire_candidates_v1";
var STAGES=["New","Review","Interview","Offer","Hired"];
var STAGE_VAR={New:"--st-new",Review:"--st-review",Interview:"--st-interview",Offer:"--st-offer",Hired:"--st-hired"};

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function load(key,fallback){
  try{var v=localStorage.getItem(key);return v?JSON.parse(v):fallback;}
  catch(e){return fallback;}
}
function save(key,val){
  try{localStorage.setItem(key,JSON.stringify(val));}catch(e){}
}
function parseSkills(str){
  return (str||"").split(",").map(function(s){return s.trim();}).filter(Boolean);
}

/* ---------------- seed (fictional) ---------------- */
function seed(){
  var jobs=[
    {id:uid(),title:"Senior Frontend Engineer",department:"Engineering",experience:"Senior",
     description:"Own the candidate-facing web app and design system. Partner with product on hiring workflows.",
     skills:["JavaScript","React","CSS","Accessibility","Testing"]},
    {id:uid(),title:"People Operations Lead",department:"People",experience:"Mid",
     description:"Run onboarding and HR operations for a growing team across three offices.",
     skills:["Onboarding","HRIS","Communication","Policy","Analytics"]},
    {id:uid(),title:"Data Analyst",department:"Analytics",experience:"Junior",
     description:"Build hiring funnel dashboards and report on pipeline conversion.",
     skills:["SQL","Python","Dashboards","Statistics","Communication"]}
  ];
  var candidates=[
    {id:uid(),name:"Amina Yusupova",experience:"6 years",education:"BSc Computer Science",status:"Interview",
     skills:["JavaScript","React","CSS","Testing","TypeScript"]},
    {id:uid(),name:"Diego Marín",experience:"3 years",education:"BA Psychology",status:"Review",
     skills:["Onboarding","Communication","HRIS","Scheduling"]},
    {id:uid(),name:"Priya Nair",experience:"1 year",education:"MSc Statistics",status:"New",
     skills:["SQL","Python","Statistics","Excel"]},
    {id:uid(),name:"Tom Becker",experience:"8 years",education:"BSc Software Engineering",status:"Offer",
     skills:["JavaScript","React","CSS","Accessibility","Testing","Node"]}
  ];
  save(KEY_J,jobs);save(KEY_C,candidates);
}
if(load(KEY_J,null)===null||load(KEY_C,null)===null){ seed(); }

function jobs(){return load(KEY_J,[]);}
function candidates(){return load(KEY_C,[]);}
function setJobs(v){save(KEY_J,v);}
function setCandidates(v){save(KEY_C,v);}

/* ---------------- helpers ---------------- */
function el(tag,attrs,html){
  var e=document.createElement(tag);
  if(attrs)for(var k in attrs){if(k==="class")e.className=attrs[k];else e.setAttribute(k,attrs[k]);}
  if(html!=null)e.innerHTML=html;
  return e;
}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function cvar(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim();}

var ICONS={
  dashboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  jobs:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
  candidates:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M17 8a3 3 0 0 1 0 6M18 19a5.5 5.5 0 0 0-3-5"/></svg>',
  matching:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h6M4 7l2-2M4 7l2 2"/><path d="M20 17h-6M20 17l-2-2M20 17l-2 2"/><circle cx="17" cy="7" r="2.5"/><circle cx="7" cy="17" r="2.5"/></svg>',
  insights:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z"/></svg>',
  pipeline:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="4" height="16" rx="1"/><rect x="10" y="4" width="4" height="11" rx="1"/><rect x="17" y="4" width="4" height="7" rx="1"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 2 18a2 2 0 0 0 1.7 3h16.6A2 2 0 0 0 22 18L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>'
};

/* ---------------- navigation ---------------- */
var PAGES=[
  {id:"dashboard",label:"Dashboard",icon:"dashboard"},
  {id:"jobs",label:"Jobs",icon:"jobs"},
  {id:"candidates",label:"Candidates",icon:"candidates"},
  {id:"matching",label:"Matching",icon:"matching"},
  {id:"insights",label:"Insights",icon:"insights"},

/* ---------------- MATCHING ---------------- */
function computeMatch(job,cand){
  var req=job.skills.map(function(s){return s.toLowerCase();});
  var have=cand.skills.map(function(s){return s.toLowerCase();});
  var matched=[],missing=[];
  job.skills.forEach(function(s,i){
    if(have.indexOf(req[i])>-1)matched.push(s);else missing.push(s);
  });
  var extra=cand.skills.filter(function(s){return req.indexOf(s.toLowerCase())<0;});
  var pct=req.length?Math.round(matched.length/req.length*100):0;
  return {matched:matched,missing:missing,extra:extra,pct:pct,reqCount:req.length};
}
function renderMatching(){
  var v=document.getElementById("view");v.innerHTML="";
  v.appendChild(pageHead("Matching","Compare one job's required skills against one candidate's listed skills."));

  if(!jobs().length||!candidates().length){
    v.appendChild(emptyState("Add at least one job and one candidate to run a match."));
    return;
  }
  var head=el("div",{class:"match-head"});
  head.innerHTML=
    '<div class="field"><label>Job</label><select id="m_job">'+jobs().map(function(j){return '<option value="'+j.id+'">'+esc(j.title)+'</option>';}).join("")+'</select></div>'+
    '<div class="field"><label>Candidate</label><select id="m_cand">'+candidates().map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>';}).join("")+'</select></div>';
  v.appendChild(head);
  var result=el("div");v.appendChild(result);

  function draw(){
    var job=jobs().filter(function(j){return j.id===document.getElementById("m_job").value;})[0];
    var cand=candidates().filter(function(c){return c.id===document.getElementById("m_cand").value;})[0];
    if(!job||!cand){result.innerHTML="";return;}
    var m=computeMatch(job,cand);
    result.innerHTML="";

    var top=el("div",{class:"card card-pad"});
    var ring=el("div",{class:"score-ring"});
    var circ=2*Math.PI*52;
    var col=m.pct>=70?cvar("--ok"):m.pct>=40?cvar("--warn"):cvar("--crit");
    ring.innerHTML=
      '<div class="ring"><svg viewBox="0 0 120 120" width="118" height="118">'+
        '<circle cx="60" cy="60" r="52" fill="none" stroke="var(--surface-2)" stroke-width="12"/>'+
        '<circle cx="60" cy="60" r="52" fill="none" stroke="'+col+'" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+circ+'" stroke-dashoffset="'+(circ*(1-m.pct/100))+'"/>'+
      '</svg><div class="pct">'+m.pct+'%</div></div>'+
      '<div style="min-width:0"><div class="section-label">Skill coverage</div>'+
        '<div style="font-size:14px;color:var(--ink-soft)">'+esc(cand.name)+' matches <b style="color:var(--ink)">'+m.matched.length+' of '+m.reqCount+'</b> required skills for '+esc(job.title)+'.</div>'+
        '<div class="formula">Formula: <code>coverage = matched required skills ÷ total required skills × 100</code><br>'+
        '= <code>'+m.matched.length+' ÷ '+m.reqCount+' × 100 = '+m.pct+'%</code>. Based only on skills listed on the profile; it is not a hiring decision.</div>'+
      '</div>';
    top.appendChild(ring);
    result.appendChild(top);

    var cols=el("div",{class:"two-col",style:"margin-top:18px"});
    var left=el("div",{class:"card card-pad"});
    left.appendChild(el("div",{class:"section-label"},"Matching skills ("+m.matched.length+")"));
    var lc=el("div",{class:"chips"});
    if(m.matched.length)m.matched.forEach(function(s){lc.appendChild(el("span",{class:"chip match"},esc(s)));});
    else lc.appendChild(el("span",{class:"item-meta"},"None of the required skills are listed."));
    left.appendChild(lc);

    var right=el("div",{class:"card card-pad"});
    right.appendChild(el("div",{class:"section-label"},"Not found in profile ("+m.missing.length+")"));
    var rc=el("div",{class:"chips"});
    if(m.missing.length)m.missing.forEach(function(s){rc.appendChild(el("span",{class:"chip miss"},esc(s)));});
    else rc.appendChild(el("span",{class:"item-meta"},"Every required skill is listed."));
    right.appendChild(rc);
    cols.appendChild(left);cols.appendChild(right);
    result.appendChild(cols);

    if(m.extra.length){
      var ex=el("div",{class:"card card-pad",style:"margin-top:18px"});
      ex.appendChild(el("div",{class:"section-label"},"Other skills on profile ("+m.extra.length+")"));
      var ec=el("div",{class:"chips"});
      m.extra.forEach(function(s){ec.appendChild(el("span",{class:"chip acc"},esc(s)));});
      ex.appendChild(ec);
      ex.appendChild(el("div",{class:"hint",style:"margin-top:8px"},"Listed by the candidate but not required by this role. Not counted in coverage."));
      result.appendChild(ex);
    }
  }
  document.getElementById("m_job").addEventListener("change",draw);
  document.getElementById("m_cand").addEventListener("change",draw);
  draw();
}

/* ---------------- INSIGHTS ---------------- */
function buildQuestions(job){
  var qs=[];
  job.skills.forEach(function(s){
    qs.push("Walk me through a recent project where you used "+s+". What was your specific role?");
  });
  if(job.experience==="Senior"||job.experience==="Lead"){
    qs.push("Describe a time you mentored others or set technical direction for "+job.department+".");
  }else if(job.experience==="Junior"){
    qs.push("How do you approach learning a new tool or skill you haven't used before?");
  }
  qs.push("What interests you about working in "+job.department+" specifically?");
  return qs;
}
function buildClarify(job){
  var c=[];
  if(!job.description||job.description.length<30)c.push("The role description is short — confirm day-to-day responsibilities with the hiring manager.");
  c.push("Confirm expected years of experience for "+job.experience+" level.");
  c.push("Which of the "+job.skills.length+" required skills are must-haves versus nice-to-haves?");
  c.push("Is this role remote, hybrid, or on-site for "+job.department+"?");
  return c;
}
function renderInsights(){
  var v=document.getElementById("view");v.innerHTML="";
  v.appendChild(pageHead("Insights","Suggested interview questions and open details to clarify for a role."));
  if(!jobs().length){v.appendChild(emptyState("Add a job to generate interview insights."));return;}

  var sel=el("div",{class:"field",style:"max-width:360px"});
  sel.innerHTML='<label>Job</label><select id="i_job">'+jobs().map(function(j){return '<option value="'+j.id+'">'+esc(j.title)+'</option>';}).join("")+'</select>';
  v.appendChild(sel);
  var out=el("div");v.appendChild(out);

  function draw(){
    var job=jobs().filter(function(j){return j.id===document.getElementById("i_job").value;})[0];
    if(!job){out.innerHTML="";return;}
    out.innerHTML="";
    var cols=el("div",{class:"two-col"});

    var qc=el("div",{class:"card card-pad"});
    qc.appendChild(el("div",{class:"section-label"},"Suggested interview questions"));
    var ol=el("ul",{class:"qlist"});
    buildQuestions(job).forEach(function(q,i){
      var li=el("li");li.innerHTML='<span class="num">'+(i+1)+'</span><span>'+esc(q)+'</span>';ol.appendChild(li);
    });
    qc.appendChild(ol);

    var cc=el("div",{class:"card card-pad"});
    cc.appendChild(el("div",{class:"section-label"},"Details to clarify"));
    var ol2=el("ul",{class:"qlist"});
    buildClarify(job).forEach(function(q){
      var li=el("li");li.innerHTML='<span class="num">?</span><span>'+esc(q)+'</span>';ol2.appendChild(li);
    });
    cc.appendChild(ol2);

    cols.appendChild(qc);cols.appendChild(cc);
    out.appendChild(cols);
  }
  document.getElementById("i_job").addEventListener("change",draw);
  draw();

function render(){
  if(current==="dashboard")renderDashboard();
  else if(current==="jobs")renderJobs();
  else if(current==="candidates")renderCandidates();
  else if(current==="matching")renderMatching();
  else if(current==="insights")renderInsights();
  else if(current==="pipeline")renderPipeline();
}

/* ---------------- drawer + theme ---------------- */
function closeDrawer(){
  document.getElementById("sidebar").classList.remove("open");
  var s=document.getElementById("scrim");if(s)s.remove();
}
document.getElementById("menuBtn").onclick=function(){
  var sb=document.getElementById("sidebar");
  sb.classList.add("open");
  var sc=el("div",{class:"scrim",id:"scrim"});sc.onclick=closeDrawer;document.body.appendChild(sc);
};
(function(){
  var saved;try{saved=localStorage.getItem("smarthire_theme");}catch(e){}
  if(saved)document.documentElement.setAttribute("data-theme",saved);
  document.getElementById("themeToggle").onclick=function(){
    var cur=document.documentElement.getAttribute("data-theme");
    var isDark=cur==="dark"||(cur!=="light"&&window.matchMedia("(prefers-color-scheme: dark)").matches);
    var next=isDark?"light":"dark";
    document.documentElement.setAttribute("data-theme",next);
    try{localStorage.setItem("smarthire_theme",next);}catch(e){}
    render();
  };
})();

/* ---------------- boot ---------------- */
(function(){
  var h="";try{h=(location.hash||"").replace("#","");}catch(e){}
  if(allowedHash(h))current=h;
  renderNav();render();
})();
</script>
